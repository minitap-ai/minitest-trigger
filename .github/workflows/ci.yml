name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Bundle with ncc
        run: npm run bundle

      # ncc exits 0 when it cannot resolve a dependency, emitting a stub that
      # throws at runtime. That shipped once (v2.5.1) and broke every consumer
      # of the v2 tag, with every other job green.
      - name: Verify the bundle loads
        run: npm run verify:bundle
